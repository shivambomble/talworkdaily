<!DOCTYPE html>
<html>

<head>
    <title>Student Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 min-h-screen flex flex-col justify-center">
    <header class="bg-gray-900 text-white p-4 text-center">
        <h1 class="text-3xl font-bold">Student Task Manager</h1>
    </header>

    <main class="max-w-xl mx-auto mt-8 bg-white p-6 rounded shadow">
        <form class="flex gap-2 mb-4">
            <input type="text" placeholder="Enter task" class="flex-1 border border-gray-300 p-2 rounded" />

            <button class="bg-blue-500 text-white px-6 py-3 text-lg rounded hover:bg-blue-600">
                Add
            </button>
        </form>

        <ul class="space-y-2">
            <li class="bg-gray-100 p-2 rounded hover:bg-yellow-100 cursor-pointer">
                Learn HTML
            </li>
            <li class="bg-gray-100 p-2 rounded hover:bg-yellow-100 cursor-pointer">
                Learn CSS
            </li>
        </ul>
    </main>

    <footer class="text-center text-gray-500 mt-8">
        Made by Shivam
    </footer>
</body>

</html>
